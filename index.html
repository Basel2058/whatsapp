<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Express</title>
<style>
  /* Layout: one small centered column on plain white — title, number field, button. Single light theme by choice. */
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #8a8a8a;
    --line: #e2e2e2;
    --accent: #25d366;
    --accent-hover: #1ebe5a;
    --error: #d93025;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  form { width: 100%; max-width: 360px; display: grid; gap: 14px; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 10px; text-align: center; }
  .row {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .row:focus-within { border-color: var(--accent); }
  select, input {
    font: inherit;
    font-size: 1.1rem;
    color: var(--fg);
    background: var(--bg);
    border: 0;
    outline: none;
    padding: 14px;
    min-width: 0;
  }
  select { border-right: 1px solid var(--line); cursor: pointer; max-width: 40%; }
  input { flex: 1; font-variant-numeric: tabular-nums; }
  .btn {
    display: block;
    text-align: center;
    text-decoration: none;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 600;
    color: #ffffff;
    background: var(--accent);
    border: 0;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .error { color: var(--error); font-size: .9rem; margin: 0; text-align: center; }
</style>
</head>
<body>

<form id="form" novalidate>
  <h1>WhatsApp Express</h1>
  <div class="row">
    <select id="country" aria-label="Country code"></select>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="050-123-4567" aria-label="Phone number" autofocus>
  </div>
  <p class="error" id="error" role="alert" hidden></p>
  <a class="btn" id="go" href="https://wa.me/" target="_blank" rel="noopener noreferrer">Open chat</a>
</form>

<script>
  const COUNTRIES = [
    ["Israel", "972"], ["Palestine", "970"], ["Jordan", "962"], ["Egypt", "20"],
    ["Saudi Arabia", "966"], ["United Arab Emirates", "971"], ["Turkey", "90"],
    ["United States", "1"], ["United Kingdom", "44"], ["Germany", "49"], ["France", "33"],
    ["Russia", "7"], ["Ukraine", "380"], ["India", "91"], ["Canada", "1"], ["Australia", "61"]
  ];
  const country = document.getElementById("country");
  const phone = document.getElementById("phone");
  const error = document.getElementById("error");
  const go = document.getElementById("go");

  COUNTRIES.forEach(([name, code], i) => {
    const opt = new Option(`+${code}`, String(i));
    opt.title = name;
    country.add(opt);
  });
  country.value = "0"; // Israel

  function buildNumber() {
    const raw = phone.value.trim();
    let digits;
    if (raw.startsWith("+") || raw.startsWith("00")) {
      digits = raw.replace(/\D/g, "").replace(/^00/, "");
    } else {
      digits = COUNTRIES[country.value][1] + raw.replace(/\D/g, "").replace(/^0+/, "");
    }
    return digits.length >= 9 && digits.length <= 15 ? digits : null;
  }

  function update() {
    const number = buildNumber();
    go.href = number ? `https://wa.me/${number}` : "https://wa.me/";
    error.hidden = true;
  }
  phone.addEventListener("input", update);
  country.addEventListener("change", update);

  go.addEventListener("click", (e) => {
    const number = phone.value.trim() ? buildNumber() : null;
    if (!number) {
      error.textContent = phone.value.trim() ? "Check the number and try again." : "Enter a phone number.";
      error.hidden = false;
      phone.focus();
      e.preventDefault();
      return;
    }
    go.href = `https://wa.me/${number}`;
  });

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    go.click();
  });
</script>
</body>
</html>
